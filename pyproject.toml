[project]
name = "python-atif"
version = "0.1.0"
description = "Pydantic schemas for the Agent Trajectory Interchange Format (ATIF)."
authors = [
    { name = "bolu61", email = "bolu61@zjc.dev" },
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atif"]
